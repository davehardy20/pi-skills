name: PR checks / Node

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-pr-checks:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # This repo keeps package-lock.json untracked (local package), so
          # no `cache: npm` (it requires a committed lockfile) and the
          # npm-install fallback below is the live path. Repos that commit
          # a lockfile should re-add `cache: npm` for faster installs.

      - name: Detect repository capabilities
        id: detect
        shell: bash
        run: node scripts/detect-node-checks.mjs

      - name: No Node package detected
        if: steps.detect.outputs.has_package_json != 'true'
        run: echo "No package.json detected; Node checks are not applicable."

      - name: Install dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        run: |
          set -euo pipefail
          # Node 22's bundled npm (11.4/11.5) crashes on lockless installs:
          # "Cannot read properties of null (reading 'edgesOut')". Fixed in
          # npm 11.6+; pin the newest 11.x (validated against this
          # package.json locally on npm@11.19.1).
          npm install -g npm@11.19.1
          if [ "${{ steps.detect.outputs.has_lockfile }}" = "true" ]; then
            npm ci
          else
            npm install --no-audit
          fi

      - name: Lint if present
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_lint == 'true'
        run: npm run lint

      - name: Lint not applicable
        if: steps.detect.outputs.has_lint != 'true'
        run: echo "No lint script detected."

      - name: Typecheck if present
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_typecheck == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.has_typecheck_script }}" = "true" ]; then
            npm run typecheck
          else
            npx --no-install tsc --noEmit
          fi

      - name: Typecheck not applicable
        if: steps.detect.outputs.has_typecheck != 'true'
        run: echo "No typecheck script or tsconfig.json detected."

      - name: Test if present
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_test == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.has_test_script }}" = "true" ]; then
            npm test
          else
            npx --no-install vitest run
          fi

      - name: Tests not applicable
        if: steps.detect.outputs.has_test != 'true'
        run: echo "No test script or supported test config detected."

      - name: Validate skills if present
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_validate_skills == 'true'
        run: npm run validate:skills

      - name: Skills validation not applicable
        if: steps.detect.outputs.has_validate_skills != 'true'
        run: echo "No validate:skills script detected."

      - name: Build if present
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_build == 'true'
        run: npm run build

      - name: Build not applicable
        if: steps.detect.outputs.has_build != 'true'
        run: echo "No build script detected."

      - name: Dependency audit if lockfile present
        if: steps.detect.outputs.has_audit == 'true'
        # Advisory until a baseline run confirms no false positives; flip
        # together with the secret scan (see Seeds follow-up).
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Dependency audit not applicable
        if: steps.detect.outputs.has_audit != 'true'
        run: echo "No npm lockfile detected for npm audit."

      - name: Secret scan
        # Advisory until a baseline run confirms no false positives in
        # skills/ content (security-tooling prose); flip via Seeds follow-up.
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
